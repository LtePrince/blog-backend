server:
  host: "127.0.0.1"
  port: 8080
  # Browser origins allowed to call the API cross-origin. Both frontends call
  # it from their own server side, so this stays empty.
  allowed_origins: []

auth:
  # Local-only token for the dev server (bound to 127.0.0.1). Production must
  # supply BLOG_AUTH_ADMIN_TOKEN via the environment — never put a real secret
  # in a committed config file.
  admin_token: "dev-local-token"

database:
  driver: "sqlite"
  dsn: "blog.db"

content:
  # Absolute path to the blog content repository root.
  # Override via env: BLOG_CONTENT_REPO_DIR
  repo_dir: "/home/adolph/workspace/Personal-website/blogs"

app:
  name: "blog-backend"
  environment: "dev"
